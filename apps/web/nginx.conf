# SPA fallback only (06-12 "traefik-paths"): Traefik routes the API paths
# (/ceo/api, /ceo/ws, /events, /ws, /ws/browser, /admin, /health) to the API app,
# everything else lands here.

# No site may frame the dashboard and clickjack "Approve and run" (06-REVIEW
# WR-14). Keyed on the original URI, which survives the try_files fallback to
# /index.html, and limited to /ceo so the office route stays embeddable. An
# empty value sends no header.
map $request_uri $ceo_frame_ancestors {
    ~^/ceo  "frame-ancestors 'none'";
    default "";
}
map $request_uri $ceo_frame_options {
    ~^/ceo  DENY;
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /, /ceo and /ceo/* all load index.html; it must always be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $ceo_frame_ancestors always;
        add_header X-Frame-Options $ceo_frame_options always;
    }
}
